# NFR-SCALE-003: Nginx làm reverse proxy / load balancer.
# NFR-SEC-004: TLS termination cho HTTPS (chứng chỉ self-signed cho môi trường local).
upstream foodblog_api {
    server api:8080;
}

upstream foodblog_frontend {
    server frontend:3000;
}

# HTTP: giữ nguyên để không phá vỡ truy cập local/health check.
server {
    listen 80;
    server_name _;

    # Upload ảnh công thức (multipart) — giữ dưới giới hạn SRS.
    client_max_body_size 20m;

    # Bảo mật cơ bản.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Backend REST API + Hangfire dashboard + health checks.
    location /api/ {
        proxy_pass http://foodblog_api;
        proxy_read_timeout 120s;
    }

    location /hangfire {
        proxy_pass http://foodblog_api;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://foodblog_api;
    }

    location /scalar {
        proxy_pass http://foodblog_api;
    }

    location /openapi {
        proxy_pass http://foodblog_api;
    }

    # Next.js frontend (SSR + static assets).
    location / {
        proxy_pass http://foodblog_frontend;
        proxy_read_timeout 60s;
    }
}

# HTTPS: TLS 1.2/1.3 với chứng chỉ self-signed sinh tự động khi container khởi động.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/self-signed.crt;
    ssl_certificate_key /etc/nginx/certs/self-signed.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location /api/ {
        proxy_pass http://foodblog_api;
        proxy_read_timeout 120s;
    }

    location /hangfire {
        proxy_pass http://foodblog_api;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://foodblog_api;
    }

    location /scalar {
        proxy_pass http://foodblog_api;
    }

    location /openapi {
        proxy_pass http://foodblog_api;
    }

    location / {
        proxy_pass http://foodblog_frontend;
        proxy_read_timeout 60s;
    }
}
