# NFR-SCALE-003: Nginx làm reverse proxy / load balancer.
upstream foodblog_api {
    server api:8080;
}

upstream foodblog_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Upload ảnh công thức (multipart) — giữ dưới giới hạn SRS.
    client_max_body_size 20m;

    # Bảo mật cơ bản.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Backend REST API + Hangfire dashboard + health checks.
    location /api/ {
        proxy_pass http://foodblog_api;
        proxy_read_timeout 120s;
    }

    location /hangfire {
        proxy_pass http://foodblog_api;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://foodblog_api;
    }

    location /scalar {
        proxy_pass http://foodblog_api;
    }

    location /openapi {
        proxy_pass http://foodblog_api;
    }

    # Next.js frontend (SSR + static assets).
    location / {
        proxy_pass http://foodblog_frontend;
        proxy_read_timeout 60s;
    }
}
