services:
  postgres:
    image: postgres:16-alpine
    container_name: foodblog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodblog
      POSTGRES_USER: foodblog
      POSTGRES_PASSWORD: foodblog123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodblog -d foodblog"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: foodblog-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  redis:
    image: redis:7-alpine
    container_name: foodblog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    container_name: foodblog-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "Foodblog123!"
    ports:
      - "1880:80"
      - "5341:5341"
    volumes:
      - seqdata:/data

  api:
    build:
      context: .
      dockerfile: src/FoodBlog.API/Dockerfile
    container_name: foodblog-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=foodblog;Username=foodblog;Password=foodblog123
      Redis__Connection: redis:6379
      MinIO__Endpoint: minio:9000
      MinIO__PublicUrl: http://localhost:9000
      Cors__Origins__0: http://localhost:8080
      Cors__Origins__1: https://localhost
      Jwt__Secret: ${JWT_SECRET:-dev-only-foodblog-jwt-secret-change-me-2026}
      Serilog__WriteTo__2__Args__serverUrl: http://seq:5341
      OpenTelemetry__OtlpEndpoint: http://seq:5341/ingest/otlp
      Sitemap__BaseUrl: http://localhost
      Sitemap__FetchUrl: http://nginx/sitemap.xml
    expose:
      - "8080"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_SITE_URL: http://localhost:8080
    container_name: foodblog-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
    expose:
      - "3000"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: foodblog-nginx
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"

  # NFR-REL-004: sao lưu PostgreSQL hằng ngày lúc 03:00 UTC, giữ 30 ngày.
  backup:
    build:
      context: ./db-backup
      dockerfile: Dockerfile
    container_name: foodblog-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: foodblog
      PGUSER: foodblog
      PGPASSWORD: foodblog123
      BACKUP_RETENTION_DAYS: "30"
    volumes:
      - backupdata:/backups

volumes:
  pgdata:
  miniodata:
  redisdata:
  seqdata:
  backupdata:
